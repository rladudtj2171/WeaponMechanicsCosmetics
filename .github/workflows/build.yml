name: Build Jar
on: [push, workflow_dispatch] # workflow_dispatch가 있으면 버튼을 눌러 수동 빌드가 가능합니다.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 26
      uses: actions/setup-java@v4
      with:
        java-version: '26'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build and Package Jars
      run: |
        chmod +x gradlew
        ./gradlew shadowJar || ./gradlew assemble || ./gradlew build -x test

    - name: Upload All Built Jars
      uses: actions/upload-artifact@v4
      with:
        name: WeaponMechanics-PR-Jars
        path: "**/build/libs/*.jar"
