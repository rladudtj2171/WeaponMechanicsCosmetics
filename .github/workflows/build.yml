name: Build Jar
on: [push, workflow_dispatch] # workflow_dispatch가 있으면 버튼을 눌러 수동 빌드가 가능합니다.

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build and Package Jars
      run: |
        chmod +x gradlew
        ./gradlew shadowJar || ./gradlew assemble || ./gradlew build -x test

    - name: Upload All Built Jars
      uses: actions/upload-artifact@v4
      with:
        name: WeaponMechanics-PR-Jars
        path: "**/build/libs/*.jar"
    - name: Create GitHub Release and Upload JAR
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create ${{ github.ref_name }} \
          **/build/libs/*.jar \
          --title "Release ${{ github.ref_name }}" \
          --notes "Automated cloud release for version ${{ github.ref_name }}."
